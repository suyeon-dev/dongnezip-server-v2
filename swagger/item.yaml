openapi: 3.0.0
info:
  title: 동네ZIP 상품 API
  description: "상품 관련 API (조회, 등록, 수정, 삭제, 찜하기, 검색 등)"
  version: 1.0.0

servers:
  - url: http://localhost:8080/api-server
    description: "Local Development Server"

tags:
  - name: Item
    description: "상품 관련 API"

paths:
  /item/item:
    get:
      summary: "전체 상품 조회 (무한 스크롤 지원)"
      description: "카테고리, 지역, 거래 상태에 따라 상품을 필터링하고 페이지네이션을 적용하여 조회합니다."
      tags: ["Item"]
      operationId: getAllItems
      security:
        - bearerAuth: []
      parameters:
        - name: categoryId
          in: query
          description: "카테고리 ID (예: 1, 2, 3)"
          required: false
          schema:
            type: integer
        - name: regionId
          in: query
          description: "지역 ID (예: 101, 102)"
          required: false
          schema:
            type: integer
        - name: status
          in: query
          description: "상품 거래 상태 필터 (available: 판매 가능, completed: 거래 완료)"
          required: false
          schema:
            type: string
            enum: [available, completed]
        - name: sortBy
          in: query
          description: "정렬 기준 (latest: 최신순, popular: 인기순)"
          required: false
          schema:
            type: string
            enum: [latest, popular]
        - name: page
          in: query
          description: "페이지 번호 (기본값: 1)"
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          description: "한 페이지당 아이템 개수 (기본값: 10)"
          required: false
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: "상품 목록 조회 성공"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Item"

  /item/soldItems:
    get:
      summary: "판매자 판매 물품 조회"
      description: "판매자가 등록한 판매 완료된 상품을 조회합니다."
      tags: ["Item"]
      operationId: getSoldItemsByUser
      security:
        - bearerAuth: []
      parameters:
        - name: sellerId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: "판매 물품 조회 성공"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Item"

  /item/search:
    get:
      summary: "상품 검색"
      description: "키워드를 기반으로 상품을 검색합니다."
      tags: ["Item"]
      operationId: searchItems
      security:
        - bearerAuth: []
      parameters:
        - name: keyword
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "상품 검색 성공"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Item"

  /item/topSeller:
    get:
      summary: "최다 판매자 조회"
      description: "거래 내역을 기반으로 최다 판매자 5명을 조회합니다."
      tags: ["Item"]
      operationId: getTopSellers
      responses:
        "200":
          description: "최다 판매자 목록 조회 성공"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TopSeller"

  /item/topBuyer:
    get:
      summary: "최다 구매자 조회"
      description: "거래 내역을 기반으로 최다 구매자 5명을 조회합니다."
      tags: ["Item"]
      operationId: getTopBuyers
      responses:
        "200":
          description: "최다 구매자 목록 조회 성공"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TopBuyer"

  /item/complete:
    post:
      summary: "상품 거래 완료"
      description: "상품을 거래 완료 상태로 변경합니다."
      tags: ["Item"]
      operationId: completeItemTransaction
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                itemId:
                  type: integer
                buyerId:
                  type: integer
      responses:
        "200":
          description: "거래 완료 성공"

  /item/favorites:
    post:
      summary: "상품 찜하기"
      description: "사용자가 특정 상품을 찜 목록에 추가합니다."
      tags: ["Item"]
      operationId: addToFavorites
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                itemId:
                  type: integer
      responses:
        "201":
          description: "상품 찜 성공"

  /item/favorites/{itemId}:
    delete:
      summary: "상품 찜 취소"
      description: "사용자가 특정 상품을 찜 목록에서 제거합니다."
      tags: ["Item"]
      operationId: removeFromFavorites
      security:
        - bearerAuth: []
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: "상품 찜 취소 성공"

  /item/addItem:
    post:
      summary: "상품 등록"
      description: "사용자가 새로운 상품을 등록합니다."
      tags: ["Item"]
      operationId: createItem
      security:
        - bearerAuth: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ItemCreate"
      responses:
        "201":
          description: "상품 등록 성공"

  /item/{itemId}:
    get:
      summary: "상품 상세 조회"
      description: "상품 ID를 기반으로 상품 상세 정보를 조회합니다."
      tags: ["Item"]
      operationId: getItemDetail
      security:
        - bearerAuth: []
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: "상품 상세 조회 성공"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"

    patch:
      summary: "상품 수정"
      description: "사용자가 등록한 상품을 수정합니다."
      tags: ["Item"]
      operationId: updateItem
      security:
        - bearerAuth: []
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ItemUpdate"
      responses:
        "200":
          description: "상품 수정 성공"

    delete:
      summary: "상품 삭제"
      description: "사용자가 등록한 상품을 삭제합니다."
      tags: ["Item"]
      operationId: deleteItem
      security:
        - bearerAuth: []
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: "상품 삭제 성공"

components:
  schemas:
    TopSeller:
      type: object
      properties:
        id:
          type: integer
        nickname:
          type: string
        profileImage:
          type: string
        salesCount:
          type: integer

    TopBuyer:
      type: object
      properties:
        id:
          type: integer
        nickname:
          type: string
        profileImage:
          type: string
        purchaseCount:
          type: integer

    Item:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        price:
          type: integer
        detail:
          type: string
        itemStatus:
          type: string
        imageUrl:
          type: string

    ItemCreate:
      type: object
      properties:
        title:
          type: string
        price:
          type: integer
        detail:
          type: string
        imageUrls:
          type: array
          items:
            type: string
            format: binary
    ItemUpdate:
      type: object
      properties:
        title:
          type: string
        price:
          type: integer
        detail:
          type: string
