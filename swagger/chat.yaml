openapi: 3.0.0
info:
  title: 상품 등록 API
  description: "이미지와 함께 상품 정보를 등록하는 API"
  version: 1.0.0

tags:
  - name: Chat
    description: "채팅 관련 API"

paths:
  /chat/rooms/{userId}:
    get:
      summary: "사용자의 채팅방 조회"
      description: "특정 사용자의 채팅방 목록을 조회합니다."
      tags: ["Chat"]
      parameters:
        - name: userId
          in: path
          description: "채팅방을 조회할 사용자 ID"
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: "채팅방 목록 조회 성공"
          content:
            application/json:
              schema:
                type: object
                properties:
                  rooms:
                    type: array
                    items:
                      $ref: "#/components/schemas/ChatRoom"
        "500":
          description: "서버 오류"
  /chat/{roomId}:
    get:
      summary: "채팅 메시지 조회"
      description: "특정 채팅방의 메시지를 조회합니다."
      tags: ["Chat"]
      parameters:
        - name: roomId
          in: path
          description: "조회할 채팅방의 ID"
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: "채팅 메시지 조회 성공"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: array
                    items:
                      $ref: "#/components/schemas/ChatMessage"
        "500":
          description: "서버 오류"
  /chat/chatroom/create:
    post:
      summary: "채팅방 생성"
      description: "새로운 채팅방을 생성합니다."
      tags: ["Chat"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                chatHost:
                  type: integer
                  example: 101
                itemId:
                  type: integer
                  example: 1
                chatGuest:
                  type: integer
                  example: 102
                guestNick:
                  type: string
                  example: "게스트닉네임"
      responses:
        "200":
          description: "채팅방 생성 성공"
          content:
            application/json:
              schema:
                type: object
                properties:
                  roomId:
                    type: integer
                    example: 1
        "500":
          description: "서버 오류"
  /chat/image:
    post:
      summary: "이미지 업로드"
      description: "채팅 메시지에 포함할 이미지를 업로드합니다."
      tags: ["Chat"]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
                  description: "업로드할 이미지 파일"
      responses:
        "200":
          description: "이미지 업로드 성공"
          content:
            application/json:
              schema:
                type: object
                properties:
                  imageUrl:
                    type: string
                    example: "https://example.com/uploaded.jpg"
        "400":
          description: "이미지 파일이 없는 경우"
        "500":
          description: "서버 오류"
components:
  schemas:
    Item:
      type: object
      properties:
        id:
          type: integer
          example: 1
        userId:
          type: integer
          example: 101
        title:
          type: string
          example: "새로운 상품"
        price:
          type: integer
          example: 50000
        status:
          type: string
          example: "available"
        detail:
          type: string
          example: "상품 상세 설명"
        itemStatus:
          type: string
          example: "new"
        category:
          type: object
          properties:
            category:
              type: string
              example: "전자제품"
        region:
          type: object
          properties:
            province:
              type: string
              example: "서울특별시"
            district:
              type: string
              example: "강남구"
        map:
          type: object
          properties:
            address:
              type: string
              example: "서울특별시 강남구 테헤란로 521"
            road_address:
              type: string
              example: "서울특별시 강남구 테헤란로 521 (삼성전자 서초사옥)"
            placeName:
              type: string
              example: "삼성전자 서초사옥"
        imageUrl:
          type: string
          example: "https://example.com/image.jpg"
    ChatRoom:
      type: object
      properties:
        roomId:
          type: integer
          example: 1
        itemId:
          type: integer
          example: 1
        chatHost:
          type: integer
          example: 101
        chatGuest:
          type: integer
          example: 102
        guestNick:
          type: string
          example: "게스트닉네임"
    ChatMessage:
      type: object
      properties:
        id:
          type: integer
          example: 1
        roomId:
          type: integer
          example: 1
        content:
          type: string
          example: "안녕하세요"
        createdAt:
          type: string
          format: date-time
          example: "2021-01-01T12:00:00Z"
